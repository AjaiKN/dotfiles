name: Release archive

# https://roborooter.com/post/releasing-on-github-actions/

on:
  push:
    branches: [ main ]
jobs:
  archive:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tagname: ${{ steps.generate_tagname.outputs.tagname }}
    steps:
    - name: Set DOTFILES environment variable
      run: printf 'DOTFILES=%s\n' "$PWD"/dotfiles >> $GITHUB_ENV
    - name: Checkout without submodules
      uses: actions/checkout@v6
      with:
        path: dotfiles
        submodules: false
        persist-credentials: false
    - name: Get submodules
      run:
        # not including private submodule
        dotfiles/submodules-update.sh bin config dot-home macos-library man nix scripts vendor
    - name: Generate tag-name
      id: generate_tagname
      working-directory: dotfiles
      shell: bash
      run:
        printf 'tagname=release_%s_%s_%s' "$(date -u +'%Y-%m-%d')" "$(git rev-parse HEAD)" "$RANDOM" >> "$GITHUB_OUTPUT"
    - name: Remove .git
      shell: bash
      run: find dotfiles -name '.git' | xargs rm -rf
    - name: Tar files
      run: tar -caf dotfiles.tar.gz --format=pax dotfiles
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        path: ./dotfiles.tar.gz
        name: dotfiles.tar.gz
    - name: Create a GitHub release
      uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
      with:
        commit: main
        tag: ${{ steps.generate_tagname.outputs.tagname }}
        artifacts: ./dotfiles.tar.gz
        artifactErrorsFailBuild: true
        makeLatest: true
        removeArtifacts: true

  # Separate job so that a failure here doesn't stop the release from being
  # published; it just won't have bundled.bashrc.
  bundle:
    needs: archive
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        path: dotfiles
        submodules: false
        persist-credentials: false
    - name: Install Raku
      uses: Raku/setup-raku@b8b1a4ebe85ef112edfc65e9edc8c57735367e3f # v1
      with:
        raku-version: "2026.09"
    - name: Bundle bashrc
      run: |
        raku dotfiles/scripts/bundle > bundled.bashrc
        bash -n bundled.bashrc
        HOME="$(mktemp -d)" bash --noprofile --rcfile bundled.bashrc -ic 'type gst'
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        path: ./bundled.bashrc
        name: bundled.bashrc
    - name: Add to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.archive.outputs.tagname }}
      run: gh release upload "$TAG" bundled.bashrc --repo "$GITHUB_REPOSITORY" --clobber
