name: Release archive

# https://roborooter.com/post/releasing-on-github-actions/

on:
  push:
    branches: [ main ]
jobs:
  archive:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Set DOTFILES environment variable
      run: printf 'DOTFILES=%s\n' "$PWD"/dotfiles >> $GITHUB_ENV
    - name: Checkout without submodules
      uses: actions/checkout@v6
      with:
        path: dotfiles
        submodules: false
    - name: Get submodules
      run:
        # not including private submodule
        dotfiles/submodules-update.sh bin config dot-home macos-library man nix scripts vendor
    - name: Install Raku
      run: sudo apt-get update && sudo apt-get install -y rakudo
    - name: Bundle bashrc
      run: |
        raku dotfiles/scripts/bundle > bundled.bashrc
        bash -n bundled.bashrc
        HOME="$(mktemp -d)" bash --noprofile --rcfile bundled.bashrc -ic 'type gst'
    - name: Generate tag-name
      id: generate_tagname
      working-directory: dotfiles
      shell: bash
      run:
        printf 'tagname=release_%s_%s_%s' "$(date -u +'%Y-%m-%d')" "$(git rev-parse HEAD)" "$RANDOM" >> "$GITHUB_OUTPUT"
    - name: Remove .git
      shell: bash
      run: find dotfiles -name '.git' | xargs rm -rf
    - name: Tar files
      run: tar -caf dotfiles.tar.gz --format=pax dotfiles
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        path: |
          ./dotfiles.tar.gz
          ./bundled.bashrc
        name: dotfiles
    - name: Create a GitHub release
      uses: ncipollo/release-action@v1.20.0
      with:
        commit: main
        tag: ${{ steps.generate_tagname.outputs.tagname }}
        artifacts: ./dotfiles.tar.gz,./bundled.bashrc
        artifactErrorsFailBuild: true
        makeLatest: true
        removeArtifacts: true
